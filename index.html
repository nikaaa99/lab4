<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Advanced Positioning Task</title> 
<style> 


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {
    position: relative;
    width: 249px;
    min-height: 100vh;
    margin-left: 64px;
    margin-right: 0;
    padding-top: 21px;

    background: white;
    font-family: Georgia, serif;
    font-size: 13px;
}



.box-static {
    position: static;
    width: 63px;
    height: 64px;
    padding: 3px;
    background-color: lightblue;
    margin-bottom: 2px;
}


.box-relative-1 {
    position: relative;
    top: 14px;
    left: 11px;

    width: 79px;
    height: 78px;
    padding: 3px;
    background-color: lightgreen;
}

.box-relative-2 {
    position: relative;
    top: -10px;
    left: 15px;

    width: 94px;
    height: 94px;
    padding: 3px;
    background-color: pink;
}


.container {
    position: relative;
    width: 235px;
    height: 235px;
    margin-top: 10px;
    background-color: lightgray;
}

.box-absolute-1 {
    position: absolute;
    top: 23px;
    left: 23px;

    width: 79px;
    height: 79px;
    padding: 3px;
    background-color: coral;
    z-index: 3;
}

.box-absolute-2 {
    position: absolute;
    top: 54px;
    left: 39px;

    width: 94px;
    height: 94px;
    padding: 3px;
    background-color: skyblue;
    z-index: 2;
}

.box-absolute-3 {
    position: absolute;
    top: 93px;
    left: 62px;

    width: 110px;
    height: 110px;
    padding: 3px;
    background-color: purple;
    z-index: 1;
}


.box-zindex-1 {
    position: absolute;
    top: 46px;
    left: 106px;

    width: 117px;
    height: 117px;
    padding: 3px;
    background-color: lightcoral;
    z-index: 5;
}

.box-zindex-2 {
    position: absolute;
    top: 84px;
    left: 129px;

    width: 117px;
    height: 117px;
    padding: 3px;
    background-color: lightseagreen;
    z-index: 4;
}


.box-fixed-1 {
    position: fixed;
    top: 14px;
    right: 12.2vw;

    width: 62px;
    height: 62px;
    padding: 3px;
    background-color: yellow;
}

.box-fixed-2 {
    position: fixed;
    bottom: 0;
    left: 16vw;

    width: 79px;
    height: 79px;
    padding: 3px;
    background-color: orange;
}


</style> 
</head> 
<body> 
<!-- Static positioned boxes --> 
<div class="box-static">Static</div> 
<div class="box-static">Static</div> 
<!-- Relative positioned boxes --> 
<div class="box-relative-1">Relative 1</div> 
<div class="box-relative-2">Relative 2</div> 
<!-- Container with absolute positioned boxes inside --> 
<div class="container"> 
<div class="box-absolute-1">Absolute 1</div> 
<div class="box-absolute-2">Absolute 2</div> 
<div class="box-absolute-3">Absolute 3</div> 
</div> 
<!-- Overlapping boxes with z-index outside container --> 
<div class="box-zindex-1">Z-Index 5</div> 
<div class="box-zindex-2">Z-Index 4</div> 
<!-- Fixed positioned boxes --> 
<div class="box-fixed-1">Fixed Top-Right</div> 
<div class="box-fixed-2">Fixed Bottom-Left</div> 
</body> 
</html>
